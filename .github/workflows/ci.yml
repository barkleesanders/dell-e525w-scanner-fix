name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: brew install shellcheck qpdf
      - name: Compile, analyze, and test
        run: bash scripts/check.sh
